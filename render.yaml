services:
  - type: web
    name: the-encounter-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start

  - type: web
    name: the-encounter-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: the-encounter-backend
          envVarKey: RENDER_EXTERNAL_URL
